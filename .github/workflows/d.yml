name: d
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p f
          shopt -s nullglob
          for x in b/*.b64; do
            n=$(basename "$x" .b64)
            base64 -d "$x" > "f/$n"
          done
          rm -rf b
          git config user.name "g"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "x"
          git push
